{% extends "base.html" %}
{% block title %}Page not found · {{ journal.name }}{% endblock %}
{% block content %}
<script>
// IONOS's forwarding endpoint exposes an internal /defaultsite fallback path,
// and browsers that cached the old forward keep rewriting "/" to it. Send those
// visitors to the homepage's explicit "index.html" URL: redirecting to "/"
// bounces straight back into the cached forward and loops forever. Slashes are
// collapsed because the forward can repeat them. Recoveries are only skipped
// when one just happened, so a bounce we did not anticipate settles here
// instead of spinning, while a later visit is still rescued.
(function () {
  var path = window.location.pathname.replace(/\/+/g, "/").replace(/\/$/, "");
  if (!/^(\/defaultsite)+(\.html)?$/.test(path)) return;
  var key = "defaultsiteRecoveredAt";
  try {
    var last = parseInt(sessionStorage.getItem(key), 10);
    if (last && Date.now() - last < 5000) return;
    sessionStorage.setItem(key, String(Date.now()));
  } catch (e) {}
  window.location.replace("{{ base }}index.html");
}());
</script>
<div class="wrap page-body page-narrow">
  <h1 class="page-heading">Page not found</h1>
  <p>The page you are looking for does not exist on this mirror.
     It may be available on the <a href="{{ journal.ojsUrl }}">journal’s OJS site</a>.</p>
  <p><a class="btn btn-primary" href="{{ base }}">Back to the homepage</a></p>
</div>
{% endblock %}
