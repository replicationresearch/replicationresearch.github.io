name: Build Zenodo snapshot export

# Monthly, plus on demand. Each run creates a GitHub Release and publishes the
# snapshot as a new version of the Zenodo record 10.5281/zenodo.21920085,
# which requires the ZENODO_TOKEN repository secret.
on:
  schedule:
    # 1st of the month, 05:47 UTC. Off the hour because GitHub delays or drops
    # on-the-hour cron jobs, and well after the 04:23 daily content refresh in
    # build.yml has committed, so the snapshot archives current data.
    - cron: "47 5 1 * *"
  workflow_dispatch: {}

permissions:
  contents: write   # create a GitHub Release

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build with root-relative paths
        # assemble_snapshot.py (next step) expects this exact input: every
        # internal link starting with a single "/", so it can turn each one
        # into a same-document "#path" anchor.
        env:
          BASE_URL: /
        run: python scripts/build.py

      - name: Assemble into one self-contained HTML file
        run: python scripts/assemble_snapshot.py

      - name: Create GitHub Release with the snapshot attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DATE=$(date -u +%Y-%m-%d)
          mv _site/r2-mirror-snapshot.html "r2-mirror-snapshot-$DATE.html"

          NOTES="Single self-contained HTML file with the full text of the R2 mirror as of ${DATE} - open it directly (double-click, no server needed) for archiving on Zenodo.

          This snapshot includes all articles published by R2. Individual articles should be cited in accordance with their respective recommended citation, not by citing this snapshot.

          Every issue/article/announcement/page is a section labelled with its original site path (e.g. /articles/9577); link or cite a specific one via that path as a fragment, e.g. this file's name + #articles/9577."

          # Re-running on the same day would otherwise fail on the existing tag.
          if gh release view "zenodo-export-${DATE}" >/dev/null 2>&1; then
            gh release upload "zenodo-export-${DATE}" "r2-mirror-snapshot-${DATE}.html" --clobber
            gh release edit "zenodo-export-${DATE}" --title "Snapshot ${DATE}" --notes "$NOTES"
          else
            gh release create "zenodo-export-${DATE}" \
              "r2-mirror-snapshot-${DATE}.html" \
              --title "Snapshot ${DATE}" \
              --notes "$NOTES"
          fi

      - name: Publish snapshot as a new Zenodo version
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
          # Anchor record: https://zenodo.org/records/21920085 - each run adds a
          # new version under its concept DOI (10.5281/zenodo.21920085).
          RECORD_ID: "21920085"
        run: |
          if [ -z "$ZENODO_TOKEN" ]; then
            echo "::error::Set the ZENODO_TOKEN secret in repo settings (scopes: deposit:write, deposit:actions)."
            exit 1
          fi

          set -o pipefail

          DATE=$(date -u +%Y-%m-%d)
          FILE="r2-mirror-snapshot-${DATE}.html"
          # The InvenioRDM records API, not the legacy deposit API: legacy
          # newversion rejects this record with "files.enabled: Please remove
          # all files first", because it builds the new version with files
          # disabled while the parent still has one attached.
          API="https://zenodo.org/api/records"
          AUTH="Authorization: Bearer $ZENODO_TOKEN"

          if [ ! -f "$FILE" ]; then
            echo "::error::Expected snapshot $FILE in the workspace, but it is not there."
            exit 1
          fi

          # curl -f hides the response body, which makes failures undebuggable.
          # req prints the body on success and, on HTTP >= 400, reports the
          # status and whatever Zenodo said before failing the step.
          # The Accept header is essential: without it Zenodo answers with its
          # legacy serialisation (no access/pids/custom_fields), and building
          # the update payload from that would silently send nulls.
          RDM="Accept: application/vnd.inveniordm.v1+json"
          req() {
            local method="$1" url="$2"; shift 2
            local out status
            out=$(mktemp)
            status=$(curl -sS -o "$out" -w '%{http_code}' -X "$method" -H "$AUTH" -H "$RDM" "$@" "$url")
            if [ "$status" -ge 400 ]; then
              {
                echo "::error::$method ${url#https://zenodo.org} failed with HTTP $status"
                echo "--- Zenodo response ---"
                cat "$out"
                echo
                echo "-----------------------"
              } >&2
              rm -f "$out"
              return 1
            fi
            cat "$out"
            rm -f "$out"
          }

          echo "Checking record $RECORD_ID is reachable..."
          req GET "$API/$RECORD_ID" | jq -r '"  found: \(.metadata.title // "?")"'

          echo "Creating new version..."
          DRAFT_ID=$(req POST "$API/$RECORD_ID/versions" | jq -r '.id // empty')
          if [ -z "$DRAFT_ID" ]; then
            echo "::error::Creating a new version returned no draft id."
            exit 1
          fi
          DRAFT="$API/$DRAFT_ID/draft"
          echo "  draft: $DRAFT_ID"

          # A new version draft starts with no files, so nothing is inherited.
          # An interrupted earlier run can still have left one behind, and
          # re-registering an existing key is an error, so clear it first.
          for KEY in $(req GET "$DRAFT/files" | jq -r '.entries[]?.key // empty'); do
            echo "  removing leftover file $KEY"
            req DELETE "$DRAFT/files/$KEY" >/dev/null
          done

          echo "Uploading $FILE ($(stat -c%s "$FILE") bytes)..."
          jq -n --arg k "$FILE" '[{key: $k}]' > fileinit.json
          req POST "$DRAFT/files" -H "Content-Type: application/json" -d @fileinit.json >/dev/null
          req PUT "$DRAFT/files/$FILE/content" \
            -H "Content-Type: application/octet-stream" --data-binary "@${FILE}" >/dev/null
          req POST "$DRAFT/files/$FILE/commit" >/dev/null
          echo "  uploaded"

          # Carry over inherited metadata (title, creators, license, community,
          # related identifiers) and refresh only the date-dependent fields, so
          # curation done by hand on the Zenodo record is preserved. Only the
          # writable sections are sent back; pids is omitted so Zenodo mints a
          # fresh version DOI rather than being handed the parent's.
          echo "Updating metadata..."
          req GET "$DRAFT" | jq --arg date "$DATE" '
            {
              access: {record: .access.record, files: .access.files},
              files: {enabled: .files.enabled},
              metadata: (
                .metadata
                | .publication_date = $date
                | .version = $date
                | .description = "<p>A single self-contained HTML file with the full text of the Replication Research (R2) mirror as of " + $date + ". Open it directly in a browser; no server needed.</p><p>This snapshot includes all articles published by R2. Individual articles should be cited in accordance with their respective recommended citation, not by citing this snapshot.</p><p>Each page is a section labelled with its original site path (e.g. /articles/9577), so specific content can be cited via that path as a fragment identifier.</p>"
              )
            }
            + (if .custom_fields then {custom_fields: .custom_fields} else {} end)
          ' > payload.json
          req PUT "$DRAFT" -H "Content-Type: application/json" -d @payload.json >/dev/null
          echo "  metadata updated"

          echo "Publishing..."
          DOI=$(req POST "$DRAFT/actions/publish" | jq -r '.pids.doi.identifier // .doi // "unknown"')
          echo "Published Zenodo version DOI: $DOI"
          echo "### Zenodo: [$DOI](https://doi.org/$DOI)" >> "$GITHUB_STEP_SUMMARY"
