name: Fetch content and deploy mirror

on:
  schedule:
    # Daily, off the hour (GitHub delays/drops on-the-hour cron jobs).
    # 04:23 UTC = 06:23 CEST / 05:23 CET.
    - cron: "23 4 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Harvest OJS and show the check report, but write/commit/deploy nothing"
        type: boolean
        default: false
      accept_ojs_upgrade:
        description: "Accept a changed OJS major.minor version (use once after the upgrade, after a dry run looked right)"
        type: boolean
        default: false
      accept_changes:
        description: "Accept content that shrank on purpose (regression check overridden)"
        type: boolean
        default: false
  push:
    branches: [main]

env:
  # OJS 3.3 -> 3.5 upgrade freeze. From this date (UTC) the SCHEDULED daily
  # updates are skipped, so the live site keeps showing the last good build
  # until it has been checked against the upgraded OJS. To resume: set the
  # repository variable MIRROR_RESUME to "true" (Settings > Secrets and
  # variables > Actions > Variables) or move this date. While frozen:
  #   - scheduled runs do nothing,
  #   - pushes still deploy, but from the committed data (OJS isn't contacted),
  #   - manual runs still contact OJS - start with "dry_run" to see the check
  #     report, then run once with "accept_ojs_upgrade".
  FREEZE_FROM: "2026-11-09"

permissions:
  contents: write   # commit refreshed data/ and assets/
  pages: write      # deploy to GitHub Pages
  id-token: write   # required by actions/deploy-pages
  issues: write     # open/close the "Mirror build failed" tracking issue
  actions: write    # delete a stale github-pages artifact on re-run (below)

concurrency:
  group: mirror-build
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      frozen: ${{ steps.freeze.outputs.frozen }}
    steps:
      - name: Check the OJS-upgrade update freeze
        id: freeze
        run: |
          today=$(date -u +%F)
          frozen=false
          if [[ ! "$today" < "$FREEZE_FROM" && "${{ vars.MIRROR_RESUME }}" != "true" ]]; then
            frozen=true
          fi
          echo "frozen=$frozen" >> "$GITHUB_OUTPUT"
          if [ "$frozen" = "true" ]; then
            echo "::notice::Daily updates are frozen (since $FREEZE_FROM, MIRROR_RESUME is not 'true'). Scheduled runs are skipped; pushes deploy from committed data."
          fi

  build-and-deploy:
    needs: gate
    # Frozen: the scheduled daily run is skipped entirely.
    if: ${{ !(needs.gate.outputs.frozen == 'true' && github.event_name == 'schedule') }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # A <user-or-org>.github.io repo is served at the domain root, not
      # under /<repo-name>/ like a normal project-pages repo - keeps this
      # workflow correct no matter which repo it runs in.
      - name: Determine base URL
        id: base_url
        run: |
          if [[ "${{ github.event.repository.name }}" == *.github.io ]]; then
            echo "value=/" >> "$GITHUB_OUTPUT"
          else
            echo "value=/${{ github.event.repository.name }}/" >> "$GITHUB_OUTPUT"
          fi

      # Frozen pushes skip OJS and build from the data already in the repo;
      # manual runs (dry run or real) always contact OJS.
      - name: Fetch content from OJS
        if: ${{ needs.gate.outputs.frozen != 'true' || github.event_name == 'workflow_dispatch' }}
        env:
          OJS_API_KEY: ${{ secrets.OJS_API_KEY }}
          GOATCOUNTER_API_TOKEN: ${{ secrets.GOATCOUNTER_API_TOKEN }}
          BASE_URL: ${{ steps.base_url.outputs.value }}
          R2_DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          R2_ACCEPT_OJS_UPGRADE: ${{ inputs.accept_ojs_upgrade && '1' || '' }}
          R2_ACCEPT_CHANGES: ${{ inputs.accept_changes && '1' || '' }}
        run: python scripts/fetch.py

      - name: Commit refreshed content if changed
        if: ${{ inputs.dry_run != true && (needs.gate.outputs.frozen != 'true' || github.event_name == 'workflow_dispatch') }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data assets
          if git diff --cached --quiet; then
            echo "No content changes."
          else
            git commit -m "chore: refresh mirrored content ($(date -u +%Y-%m-%d))"
            git pull --rebase --autostash origin main || true
            git push
          fi

      - name: Build static site
        if: ${{ inputs.dry_run != true }}
        env:
          BASE_URL: ${{ steps.base_url.outputs.value }}
        run: python scripts/build.py

      - name: Enable GitHub Pages (first run)
        if: ${{ inputs.dry_run != true }}
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Remove stale github-pages artifact from a previous attempt
        # Re-running this job (rather than triggering a brand-new run) leaves
        # the earlier attempt's "github-pages" artifact in place; the new
        # attempt then uploads a second one with the same name, and
        # deploy-pages fails with "Multiple artifacts named github-pages
        # were unexpectedly found". Only relevant on attempt 2+.
        if: ${{ github.run_attempt != '1' && inputs.dry_run != true }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
            --jq '.artifacts[] | select(.name == "github-pages") | .id' |
          while read -r id; do
            echo "Deleting stale artifact $id"
            gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id"
          done

      - name: Upload Pages artifact
        if: ${{ inputs.dry_run != true }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        if: ${{ inputs.dry_run != true }}
        uses: actions/deploy-pages@v4

      # Fallback notification: GitHub already emails repo owners on a failed
      # run by default, but that setting can be off or filtered. This opens
      # (or comments on) a durable, visible issue instead, and auto-closes it
      # once a run succeeds again. Either way, a failure here never touches
      # the published site: fetch.py only writes data/ after its own sanity
      # checks pass, and a failed step stops the job before build/deploy run,
      # so the last successful build stays live untouched.
      - name: Open/update failure issue
        if: ${{ failure() && inputs.dry_run != true }}
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Mirror build failed";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `The scheduled mirror build failed on ${new Date().toISOString().slice(0, 10)}.\n\n` +
              `Run log: ${runUrl}\n\n` +
              "The published site was **not** changed by this run - it still shows the last successful build.";
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: "open", per_page: 50,
            });
            const existing = issues.find(i => i.title === title && !i.pull_request);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo, title, body,
              });
            }

      - name: Close failure issue if this run succeeded
        if: ${{ success() && inputs.dry_run != true && (needs.gate.outputs.frozen != 'true' || github.event_name == 'workflow_dispatch') }}
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Mirror build failed";
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: "open", per_page: 50,
            });
            const existing = issues.find(i => i.title === title && !i.pull_request);
            if (existing) {
              const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number,
                body: `The mirror build is passing again: ${runUrl}`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, state: "closed",
              });
            }
